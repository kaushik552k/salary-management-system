version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://assignment-api.kaushikcodes.in/api
    ports:
      - "3002:3000"
    restart: always
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3003:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/salary_db?schema=public
      - PORT=3001
      - FRONTEND_URL=https://assignment.kaushikcodes.in
      - EXCHANGE_RATES_USD={"USD":1,"INR":0.012,"GBP":1.27,"EUR":1.09,"CAD":0.74,"AUD":0.65,"SGD":0.75,"BRL":0.20,"JPY":0.0067}
      - EXCHANGE_RATES_INR={"USD":83.5,"INR":1,"GBP":106.8,"EUR":91.2,"CAD":61.5,"AUD":54.8,"SGD":62.3,"BRL":16.9,"JPY":0.56}
    restart: always
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: salary_db
    # Port mapping removed to prevent conflicts with your existing 'kaushik-postgres' on port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
