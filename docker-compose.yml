version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://assignment-api.kaushikcodes.in/api
    ports:
      - "3002:3000"
    restart: always
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3003:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/salary_db?schema=public
      - PORT=3001
      - FRONTEND_URL=https://assignment.kaushikcodes.in
    restart: always
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: salary_db
    # Port mapping removed to prevent conflicts with your existing 'kaushik-postgres' on port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
